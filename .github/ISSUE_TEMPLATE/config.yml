# Issue 模板配置：重检与数据纠错使用结构化表单；参考资料和本机诊断使用 contact_links
blank_issues_enabled: true
contact_links:
  - name: 📖 评分规则与数据口径（先看这里）
    url: https://dsh-insights.com/about/?utm_source=github&utm_medium=issue-template
    about: 评分规则、扣分项、收录口径、更新频率全部公开，可复核可反驳。多数「为什么是这个分数」在这里就有答案。
  - name: 🔄 申请重检（数据过期 / 刚发了新版）
    url: https://github.com/ice5kysl/dsh-insights/issues/new?template=data-correction.yml
    about: 填写数据纠错 / 重检申请表单，提供 owner/repo 和版本或提交证据，由维护者处理；Actions 手动运行需要本仓库写入权限。
  - name: 🩺 插件加载崩溃（打开 dsh web 红屏）
    url: https://www.npmjs.com/package/dsh-insights-kit
    about: 本机急救先跑 `npx dsh-insights-kit doctor`（离线诊断 + 一键隔离肇事插件）；确认是我们「实测兼容」数据判错了再回来提 issue。

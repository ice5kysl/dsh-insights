name: pages

on:
  push:
    branches: [main]
  # bot push 不触发 workflow：refresh 成功完成后由本 workflow 接力部署，形成 CI 闭环
  workflow_run:
    workflows: [refresh]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stage public root (site + slim public data + llms.txt)
        run: |
          mkdir -p public/data
          cp -r site/. public/ 2>/dev/null || true
          for f in insights.json health.json analysis.json plugins.jsonl invalid.jsonl enrich.json downloads.json listed.json plugins.csv; do
            cp "data/$f" public/data/ 2>/dev/null || true
          done
          test -f llms.txt && cp llms.txt public/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

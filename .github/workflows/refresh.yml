# Daily refresh of the dsh-plugin-insights snapshot (CI 定时刷新)
#
# - Requires a repo secret `DSH_GH_TOKEN` (fine-grained PAT, Contents read/write
#   + Metadata read on this repo) for a raised GitHub API budget. Falls back to
#   the built-in `GITHUB_TOKEN` if the secret is absent (search still capped,
#   budget-floor in stages makes the run degrade gracefully).
# - Runs the full pipeline (discover → validate → analyze → site → export →
#   score → export:json) and commits the new snapshot when anything changed.
# - `workflow_dispatch` lets you trigger it manually.

name: refresh

on:
  schedule:
    - cron: '0 3 * * *'          # 每天 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.DSH_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node bin/dsh-plugin-insights.mjs run
      - name: Refresh enrich (lists/downloads/diff)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bin/refresh-extra.mjs
      - name: Commit snapshot changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ site/
          if git diff --cached --quiet; then
            echo 'no changes'
          else
            git commit -m "chore: refresh snapshot $(date -u +%F)"
            git push
          fi

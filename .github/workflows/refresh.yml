# Daily refresh of the dsh-insights snapshot (CI 定时刷新)
#
# - 每小时 4 条错开 cron（:09/:24/:39/:54）。GitHub schedule 投递不准点（实测可能整天落不进指定
#   小时），故按 UTC 日去重而非按小时：每个 UTC 日首个到达的 schedule run 跑
#   daily（周一跑 monday：daily + 作者关系图 + metrics + 信件 + 周报——周日 24:00
#   后才是完整一周，2026-09 起由周五改为周一），其余
#   run 跑 `pipeline hourly`（增量纳新：discover-incr + validate + dynamics + 发布层）。
#   去重状态存 data/last-daily.txt，随快照提交闭环。
# - 曾计划 db9 pg_cron 每小时 POST repository_dispatch 作主触发器，实测被封印不可用：
#   cron.schedule 全库报 PreActivationSeal、cron.job 为只读虚拟目录（2026-09-15 验证），
#   待 db9 官方解封后可切回。当前 GitHub 原生 schedule 加密错开为主触发器，
#   repository_dispatch(db9-cron) 保留给手动/外部触发，均按上面的 UTC 日去重工作。
# - Manual `workflow_dispatch` mode=full: `pipeline full`（全量管线）。
# - Token: falls back to built-in GITHUB_TOKEN; set repo secret `DSH_GH_TOKEN`
#   for a raised API budget.
# - concurrency 组防止多 run 并发写 data/（cancel-in-progress: false 排队执行）。
# - bot push 不触发新 workflow（GitHub 限制），Pages 部署由 pages.yml 的
#   `workflow_run`（refresh 成功完成后）触发，形成闭环。
# - 每次运行（含失败）由末尾的 run-report 步骤落 db9 pipeline_runs 表（dsh-data 库，
#   /admin/pipeline 页可视化），并做缺口自检：>6h 无成功 / UTC 14 点后当日 daily
#   缺席 → 自动开 ops-timer issue（按 label 去重）。定时器不再静默失联。

name: refresh

on:
  schedule:
    - cron: '9,24,39,54 * * * *'
  repository_dispatch:
    types: [db9-cron]
  workflow_dispatch:
    inputs:
      mode:
        description: 'refresh (daily) / monday (daily+周报) / full (全量管线)'
        required: true
        default: refresh
        type: choice
        options:
          - refresh
          - monday
          - full

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Full pipeline (manual mode=full)
        if: inputs.mode == 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.DSH_GH_TOKEN || secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 站点访问统计入 db9（bin/traffic-sync.mjs）；secret 未配置时该阶段自动跳过
          UMAMI_SHARE: ${{ secrets.UMAMI_SHARE }}
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
          GA4_PROPERTY: ${{ secrets.GA4_PROPERTY }}
        run: node bin/pipeline.mjs full
      - name: Scheduled refresh（每个 UTC 日首个 schedule run 跑 daily/周一 monday，其余 hourly）
        if: inputs.mode != 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.DSH_GH_TOKEN || secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 升级源 shell：大多数用户所在线，保持它在矩阵里才能回答「从 X 升上来会不会坏」；
          # 0.1.5 稳定、用户迁移完成后移除
          DSH_MATRIX_EXTRA_SHELLS: 0.1.2-rc.1
          # db9 旁路存储同步（pipeline/publish/db9-sync.mjs）；secret 未配置时该阶段自动跳过
          DB9_TOKEN: ${{ secrets.DB9_TOKEN }}
          # 站点访问统计（bin/traffic-sync.mjs）→ db9 site_traffic，公开仓库里不落数
          # UMAMI_SHARE 是 dsh-insights.com 的 Umami 分享链接（公开只读，但按 secret 存）
          UMAMI_SHARE: ${{ secrets.UMAMI_SHARE }}
          # GA4（dsh-why.com）：GA4_SA_KEY = 服务账号 JSON 内容，GA4_PROPERTY = 数字资源 ID
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
          GA4_PROPERTY: ${{ secrets.GA4_PROPERTY }}
        run: |
          TODAY=$(date -u +%F)
          LAST=$(cat data/last-daily.txt 2>/dev/null || echo never)
          MODE=hourly
          if [ "${{ inputs.mode }}" = "monday" ]; then
            MODE=monday
          elif { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "repository_dispatch" ]; } && [ "$LAST" = "$TODAY" ]; then
            MODE=hourly
          elif [ "$(date -u +%u)" = "1" ]; then
            MODE=monday
          else
            MODE=daily
          fi
          echo "today=$TODAY last-daily=$LAST mode=$MODE"
          # 运行元信息给最后的 run-report 步骤用（写 RUNNER_TEMP，不进 git，避免每小时制造空提交）
          printf '{"run_id":%s,"event":"%s","mode":"%s","started_at":"%s"}\n' \
            "${{ github.run_id }}" "${{ github.event_name }}" "$MODE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "${RUNNER_TEMP}/last-run.json"
          node bin/pipeline.mjs "$MODE"
          # 非 hourly 模式（daily/monday，含手动触发）推进去重标记，防重复跑日更
          if [ "$MODE" != "hourly" ]; then
            echo "$TODAY" > data/last-daily.txt
          fi
      - name: Report run to db9（定时器可观测性，best-effort 不影响主任务）
        if: always() && inputs.mode != 'full'
        env:
          DB9_TOKEN: ${{ secrets.DB9_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bin/run-report.mjs || true
      - name: Commit snapshot changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # site/ 已移出版本控制（gitignore），部署由 pages.yml 现场生成；这里只提交 data/
          # README*.md：readme-sync 阶段自动对账的数字区间（stats 锚点内），随快照一起提交
          git add data/ README.md README.zh-CN.md
          if git diff --cached --quiet; then
            echo 'no changes'
          else
            git commit -m "chore: refresh snapshot $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi

# Daily refresh of the dsh-insights snapshot (CI 定时刷新)
#
# - 每小时 :23 一条 cron。GitHub schedule 投递不准点（实测可能整天落不进指定
#   小时），故按 UTC 日去重而非按小时：每个 UTC 日首个到达的 schedule run 跑
#   daily（周五跑 friday：daily + 作者关系图 + metrics + 信件 + 周报），其余
#   run 跑 `pipeline hourly`（增量纳新：discover-incr + validate + dynamics + 发布层）。
#   去重状态存 data/last-daily.txt，随快照提交闭环。
# - Manual `workflow_dispatch` mode=full: `pipeline full`（全量管线）。
# - Token: falls back to built-in GITHUB_TOKEN; set repo secret `DSH_GH_TOKEN`
#   for a raised API budget.
# - concurrency 组防止多 run 并发写 data/（cancel-in-progress: false 排队执行）。
# - bot push 不触发新 workflow（GitHub 限制），Pages 部署由 pages.yml 的
#   `workflow_run`（refresh 成功完成后）触发，形成闭环。

name: refresh

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'refresh (daily) / friday (daily+周报) / full (全量管线)'
        required: true
        default: refresh
        type: choice
        options:
          - refresh
          - friday
          - full

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Full pipeline (manual mode=full)
        if: inputs.mode == 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.DSH_GH_TOKEN || secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node bin/pipeline.mjs full
      - name: Scheduled refresh（每个 UTC 日首个 schedule run 跑 daily/周五 friday，其余 hourly）
        if: inputs.mode != 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.DSH_GH_TOKEN || secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          TODAY=$(date -u +%F)
          LAST=$(cat data/last-daily.txt 2>/dev/null || echo never)
          echo "today=$TODAY last-daily=$LAST"
          if [ "${{ inputs.mode }}" = "friday" ]; then
            echo "Friday profile (manual)"
            node bin/pipeline.mjs friday
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$LAST" = "$TODAY" ]; then
            echo "Hourly incremental profile"
            node bin/pipeline.mjs hourly
          elif [ "$(date -u +%u)" = "5" ]; then
            echo "Friday profile"
            node bin/pipeline.mjs friday
            echo "$TODAY" > data/last-daily.txt
          else
            echo "Daily profile"
            node bin/pipeline.mjs daily
            echo "$TODAY" > data/last-daily.txt
          fi
      - name: Commit snapshot changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ site/
          if git diff --cached --quiet; then
            echo 'no changes'
          else
            git commit -m "chore: refresh snapshot $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi

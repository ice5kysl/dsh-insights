# Daily refresh of the dsh-insights snapshot (CI 定时刷新)
#
# - Daily (schedule 03:07 UTC): `pipeline daily` — lists / downloads /
#   analyze / site / export / diff / pages, then commits new snapshot.
# - Friday (schedule 03:07 UTC Fri): `pipeline friday` — daily + 内容层
#   （letters diff 驱动 + 生态周报 + feed 重建），落地 PRODUCT-PLAN §4.3 周报节奏。
# - Manual `workflow_dispatch` mode=full: `pipeline full`（discover →
#   validate → 全量）；mode=friday 可手动补跑周报。
# - Token: falls back to built-in GITHUB_TOKEN; set repo secret `DSH_GH_TOKEN`
#   for a raised API budget.
# - Commit step pulls with rebase so concurrent pushes never break the run.

name: refresh

on:
  schedule:
    - cron: '7 3 * * *'
    - cron: '7 3 * * 5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'refresh (daily) / friday (daily+周报) / full (全量管线)'
        required: true
        default: refresh
        type: choice
        options:
          - refresh
          - friday
          - full

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Full pipeline (manual mode=full)
        if: inputs.mode == 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.DSH_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node bin/pipeline.mjs full
      - name: Friday refresh (daily + letters + weekly)
        if: inputs.mode == 'friday' || (github.event_name == 'schedule' && github.event.schedule == '7 3 * * 5')
        env:
          GITHUB_TOKEN: ${{ secrets.DSH_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node bin/pipeline.mjs friday
      - name: Daily refresh
        if: inputs.mode != 'full' && inputs.mode != 'friday' && github.event.schedule != '7 3 * * 5'
        env:
          GITHUB_TOKEN: ${{ secrets.DSH_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node bin/pipeline.mjs daily
      - name: Commit snapshot changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ site/
          if git diff --cached --quiet; then
            echo 'no changes'
          else
            git commit -m "chore: refresh snapshot $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi

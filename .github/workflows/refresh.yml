# Daily refresh of the dsh-plugin-insights snapshot (CI 定时刷新模板)
#
# - Requires a repo secret GITHUB_TOKEN with `repo` scope (a fine-grained token
#   with Contents read/write on this repo is enough) to raise the API budget.
# - Runs the full pipeline (discover → validate → analyze → site → export) and
#   commits the new snapshot when anything changed.
# - `workflow_dispatch` lets you trigger it manually.

name: refresh

on:
  schedule:
    - cron: '0 3 * * *'          # 每天 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bin/dsh-plugin-insights.mjs run
      - name: Commit snapshot changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ site/
          if git diff --cached --quiet; then
            echo 'no changes'
          else
            git commit -m "chore: refresh snapshot $(date -u +%F)"
            git push
          fi

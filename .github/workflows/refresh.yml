# Daily refresh of the dsh-plugin-insights snapshot (CI 定时刷新)
#
# - Default run (schedule): light refresh — lists / downloads / analyze /
#   site / export / diff, then commits new snapshot when changed.
# - Manual `workflow_dispatch` with mode=full: runs the entire pipeline
#   (discover → validate → …) before refreshing.
# - Token: falls back to built-in GITHUB_TOKEN; set repo secret `DSH_GH_TOKEN`
#   for a raised API budget.
# - Commit step pulls with rebase so concurrent pushes never break the run.

name: refresh

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'refresh (light) or full pipeline'
        required: true
        default: refresh
        type: choice
        options:
          - refresh
          - full

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Full pipeline (optional)
        if: inputs.mode == 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.DSH_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node bin/dsh-plugin-insights.mjs run
      - name: Light refresh (lists/downloads/analyze/site/export/diff)
        env:
          GITHUB_TOKEN: ${{ secrets.DSH_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node bin/refresh-extra.mjs
      - name: Commit snapshot changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ site/
          if git diff --cached --quiet; then
            echo 'no changes'
          else
            git commit -m "chore: refresh snapshot $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi

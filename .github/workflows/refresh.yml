# Daily refresh of the dsh-insights snapshot (CI 定时刷新)
#
# - 每日 03:07 UTC 一条 cron；job 内按 UTC 星期几选择 profile：
#   周五跑 `pipeline friday`（daily + 作者关系图 + metrics + 信件 + 周报），
#   其余天跑 `pipeline daily`。
# - Manual `workflow_dispatch` mode=full: `pipeline full`（全量管线）。
# - Token: falls back to built-in GITHUB_TOKEN; set repo secret `DSH_GH_TOKEN`
#   for a raised API budget.
# - concurrency 组防止多 run 并发写 data/（cancel-in-progress: false 排队执行）。
# - bot push 不触发新 workflow（GitHub 限制），Pages 部署由 pages.yml 的
#   `workflow_run`（refresh 成功完成后）触发，形成闭环。

name: refresh

on:
  schedule:
    - cron: '7 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'refresh (daily) / friday (daily+周报) / full (全量管线)'
        required: true
        default: refresh
        type: choice
        options:
          - refresh
          - friday
          - full

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Full pipeline (manual mode=full)
        if: inputs.mode == 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.DSH_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node bin/pipeline.mjs full
      - name: Daily refresh (周五自动切 friday profile)
        if: inputs.mode != 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.DSH_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.mode }}" = "friday" ] || [ "$(date -u +%u)" = "5" ]; then
            echo "Friday profile"
            node bin/pipeline.mjs friday
          else
            echo "Daily profile"
            node bin/pipeline.mjs daily
          fi
      - name: Commit snapshot changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ site/
          if git diff --cached --quiet; then
            echo 'no changes'
          else
            git commit -m "chore: refresh snapshot $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi
